- name: SearchSiteApiDocs
  description: Retrieves the API documentation for the Wix business solutions installed on this site,
    and informs the AI client how to use the APIs.
  inputs:
  - searchTerm
- name: GenerateVisitorToken
  description: Creates a new visitor session and obtains a visitor access token for the site.
  inputs: []
- name: CallWixSiteAPI
  description: Calls Wix API methods on the site to perform actions on a visitor's behalf, such as querying
    site data, booking an appointment, or starting a purchase.
  inputs:
  - visitorToken
  - url
  - method
  - body
- name: ExecuteWixAPI
  description: Executes generated code against the Wix APIs for this site.
  inputs:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
