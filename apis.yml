aid: seurat
name: Seurat Technologies
description: >-
  Seurat Technologies is a Wilmington, Massachusetts contract manufacturer that produces
  high-volume metal parts using its proprietary Area Printing technology, a Laser Powderbed Fusion
  (LPBF) additive process that decouples print speed from resolution and is positioned as roughly
  10x more productive than conventional LPBF. Seurat does not sell 3D printers; it sells parts,
  qualifying customer designs through its Area Printing Production (APP) qualification program and
  then mass-producing them at localized factories for consumer electronics, automotive, energy,
  aerospace and defense OEMs. The company markets its process on reshoring, supply-chain
  resilience, tariff resistance and decarbonization, and engages customers through a quote /
  upload-your-part motion rather than any developer-facing product.
